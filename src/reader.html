<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #111111; --orange: #F7941D; --orange-soft: #FFD08A; --cream: #FFF8EC;
    --grey: #6b6f76; --paper: #ffffff; --warn: #b45309;
    --round: "Arial Rounded MT Bold", "Avenir Next Rounded", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 6px 8px 10px; background: transparent; color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* Rutan med meningen som läses */
  .now { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px;
         box-shadow: 0 6px 0 var(--ink); padding: 20px 24px; min-height: 120px;
         font-size: 1.4rem; line-height: 1.5; font-weight: 600; }

  /* Knapparna är bilder */
  .controls { display: flex; align-items: center; justify-content: center; gap: 14px;
              margin: 22px 0 10px; }
  button.ic { background: none; border: 0; padding: 0; cursor: pointer; line-height: 0;
              transition: transform .1s; }
  button.ic img { height: 56px; width: auto; display: block; pointer-events: none; }
  button.ic.main img { height: 70px; }
  button.ic:hover { transform: rotate(-4deg) scale(1.08); }
  button.ic:active { transform: translateY(3px) scale(0.96); }
  button.ic:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; border-radius: 12px; }

  .meta { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 0; }
  select { border: 3px solid var(--ink); border-radius: 12px; background: var(--paper);
           color: var(--ink); padding: 6px 8px; font-size: 0.95rem; font-weight: 700;
           font-family: var(--round); cursor: pointer; }
  .time { font-family: var(--round); font-size: 1rem; color: var(--grey);
          font-variant-numeric: tabular-nums; }

  /* Tidslinje */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px;
                      background: transparent; margin: 8px 0 2px; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 14px; border: 3px solid var(--ink); border-radius: 10px;
    background: linear-gradient(to right, var(--orange) var(--p, 0%), var(--paper) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%;
    background: var(--orange); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  input[type=range]::-moz-range-track {
    height: 14px; border: 3px solid var(--ink); border-radius: 10px;
    background: linear-gradient(to right, var(--orange) var(--p, 0%), var(--paper) var(--p, 0%)); }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; background: var(--orange);
    border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }

  .status { min-height: 1.4em; font-family: var(--round); font-size: 0.85rem; color: var(--grey);
            margin: 4px 2px 8px; }
  .status.warn { color: var(--warn); }

  /* Meningslistan */
  .list { height: 300px; overflow-y: auto; background: var(--paper); border: 3px solid var(--ink);
          border-radius: 20px; padding: 8px; box-shadow: 0 6px 0 var(--ink); }
  .s { padding: 9px 14px; border-radius: 12px; cursor: pointer; line-height: 1.45; color: #4b4f56;
       border: 2px solid transparent; }
  .s:hover { background: var(--cream); }
  .s.pending { opacity: 0.38; cursor: default; }
  .s.pending:hover { background: transparent; }
  .s.active { background: var(--orange-soft); color: var(--ink); font-weight: 600;
              border-color: var(--ink); }
  .hint { color: var(--grey); font-size: 0.8rem; margin: 14px 2px 0; }
</style>
</head>
<body>
  <div class="now" id="now"></div>

  <div class="controls">
    <button class="ic" id="prev" title="Föregående mening (←)"><img id="img-prev" alt="Bakåt"></button>
    <button class="ic main" id="play" title="Spela/pausa (mellanslag)"><img id="img-play" alt="Spela"></button>
    <button class="ic" id="stop" title="Stopp, tillbaka till början"><img id="img-stop" alt="Stopp"></button>
    <button class="ic" id="next" title="Nästa mening (→)"><img id="img-next" alt="Framåt"></button>
  </div>

  <div class="meta">
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="speed" title="Hastighet">
      <option value="0.75">0,75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1,25×</option>
      <option value="1.5">1,5×</option>
      <option value="2">2×</option>
    </select>
  </div>

  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="status" id="status"></div>
  <div class="list" id="list"></div>
  <div class="hint">Mellanslag = spela/pausa · ← → = mening bakåt/framåt · klicka på en mening för att hoppa dit</div>

<script>
  const init = __DATA__;            // { baseUrl, sentences, icons }
  const S = init.sentences;
  const ICONS = init.icons;
  const audio = new Audio();
  audio.preload = "auto";
  const $ = (id) => document.getElementById(id);
  const RESTART_THRESHOLD = 1.5;    // sekunder

  let chunks = [];                  // färdiga ljudbitar enligt manifest.json
  let totalChunks = 0;
  let status = "generating";        // generating | done | error
  let errorText = "";
  let cur = -1;                     // vilken bit som är inladdad (index i chunks)
  let wantPlay = false;             // användaren vill att det ska spela
  let waiting = false;              // väntar på att nästa bit blir klar
  let pendingSeek = null;           // tid att hoppa till när biten har laddats
  let rate = 1;
  let activeIndex = -1;
  let readyCount = 0;               // antal meningar som har ljud
  let dragging = false;

  // Knappbilderna
  $("img-prev").src = ICONS.prev;
  $("img-stop").src = ICONS.stop;
  $("img-next").src = ICONS.next;
  $("img-play").src = ICONS.play;

  // ---------- Meningslistan (textContent, aldrig innerHTML) ----------
  const rows = S.map((text, i) => {
    const el = document.createElement("div");
    el.className = "s pending";
    el.textContent = text;
    el.addEventListener("click", () => { if (i < readyCount) { wantPlay = true; seekSentence(i); } });
    $("list").appendChild(el);
    return el;
  });
  $("now").textContent = S[0] || "";

  // ---------- Hjälpfunktioner ----------
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const chunkOf = (g) => chunks.findIndex((c) => g >= c.first && g < c.first + c.count);

  function currentSentence() {
    if (cur < 0) return 0;
    const c = chunks[cur], t = audio.currentTime;
    let i = 0;
    for (let k = 0; k < c.starts.length; k++) { if (c.starts[k] <= t + 0.001) i = k; else break; }
    return c.first + i;
  }

  function elapsed() {
    if (cur < 0) return 0;
    let sum = 0;
    for (let k = 0; k < cur; k++) sum += chunks[k].duration;
    return sum + audio.currentTime;
  }

  // ---------- Ladda och hoppa ----------
  function loadChunk(index, localTime) {
    cur = index;
    pendingSeek = localTime;
    waiting = false;
    audio.src = init.baseUrl + chunks[index].file;
    audio.defaultPlaybackRate = rate;
    audio.playbackRate = rate;
    audio.load();
  }

  audio.addEventListener("loadedmetadata", () => {
    if (pendingSeek !== null) { audio.currentTime = pendingSeek; pendingSeek = null; }
    if (wantPlay) audio.play().catch(() => {});
    render();
  });

  function seekSentence(g) {
    const ci = chunkOf(g);
    if (ci < 0) return;                       // inte klar än
    const local = chunks[ci].starts[g - chunks[ci].first];
    if (ci === cur) {
      audio.currentTime = local;
      if (wantPlay && audio.paused) audio.play().catch(() => {});
    } else {
      loadChunk(ci, local);
    }
    render();
  }

  function prev() {
    const g = currentSentence();
    const start = cur >= 0 ? chunks[cur].starts[g - chunks[cur].first] : 0;
    if (cur >= 0 && audio.currentTime - start > RESTART_THRESHOLD || g === 0) seekSentence(g);
    else seekSentence(g - 1);
  }

  function next() {
    const g = currentSentence();
    if (g + 1 < S.length) seekSentence(g + 1);
  }

  function toggle() {
    if (wantPlay) {                           // pausa
      wantPlay = false; waiting = false; audio.pause();
    } else {                                  // spela
      wantPlay = true;
      if (cur < 0) { if (chunks.length) loadChunk(0, 0); else waiting = true; }
      else if (audio.ended) seekSentence(0);
      else audio.play().catch(() => {});
    }
    render();
  }

  function stop() {                           // pausa och gå tillbaka till början
    wantPlay = false; waiting = false; audio.pause();
    if (cur >= 0) seekSentence(0);
    render();
  }

  audio.addEventListener("ended", () => {
    if (cur + 1 < chunks.length) loadChunk(cur + 1, 0);
    else if (status === "done") { wantPlay = false; }
    else waiting = true;                      // nästa bit görs fortfarande
    render();
  });

  // ---------- Rendering ----------
  function render() {
    const g = currentSentence();
    if (g !== activeIndex) {
      if (activeIndex >= 0) rows[activeIndex].classList.remove("active");
      rows[g].classList.add("active");
      $("now").textContent = S[g];
      const list = $("list"), el = rows[g];
      list.scrollTop = el.offsetTop - list.offsetTop - list.clientHeight / 2 + el.clientHeight / 2;
      activeIndex = g;
    }
    let total = 0; chunks.forEach((c) => { total += c.duration; });
    $("time").textContent = fmt(elapsed()) + " / " + fmt(total) + (status === "done" ? "" : "+");
    if (!dragging && S.length > 1) {
      const value = Math.round((g / (S.length - 1)) * 1000);
      $("seek").value = value;
      $("seek").style.setProperty("--p", (value / 10) + "%");
    }
    $("img-play").src = wantPlay ? ICONS.pause : ICONS.play;
    $("img-play").alt = wantPlay ? "Pausa" : "Spela";

    const st = $("status");
    st.classList.toggle("warn", status === "error" || waiting);
    if (status === "error") st.textContent = "Fel vid ljudgenerering: " + errorText;
    else if (waiting || (wantPlay && cur < 0)) st.textContent = "Väntar på att ljudet ska bli klart…";
    else if (status === "generating" && chunks.length === 0) st.textContent = "Gör första biten ljud…";
    else if (status === "generating") st.textContent = "Gör ljud: " + chunks.length + " av " + totalChunks + " bitar klara. Du kan lyssna redan nu.";
    else st.textContent = "";
  }

  function updateReady() {
    const last = chunks.length ? chunks[chunks.length - 1] : null;
    readyCount = last ? last.first + last.count : 0;
    rows.forEach((el, i) => el.classList.toggle("pending", i >= readyCount));
  }

  // ---------- Hämta manifestet tills allt är klart ----------
  async function poll() {
    try {
      const r = await fetch(init.baseUrl + "manifest.json?" + Date.now(), { cache: "no-store" });
      if (r.ok) {
        const m = await r.json();
        chunks = m.chunks; totalChunks = m.total_chunks; status = m.status; errorText = m.error || "";
        updateReady();
        if (wantPlay && cur < 0 && chunks.length) loadChunk(0, 0);
        else if (waiting && cur + 1 < chunks.length) loadChunk(cur + 1, 0);
      }
    } catch (e) { /* försök igen */ }
    render();
    if (status === "generating") setTimeout(poll, 1000);
  }

  // ---------- Kontroller ----------
  $("seek").addEventListener("input", () => {
    dragging = true;
    $("seek").style.setProperty("--p", ($("seek").value / 10) + "%");
  });
  $("seek").addEventListener("change", () => {
    dragging = false;
    let g = Math.round(($("seek").value / 1000) * (S.length - 1));
    g = Math.min(g, readyCount - 1);          // inte längre än det som är klart
    if (g >= 0) seekSentence(g);
    render();
  });
  $("prev").addEventListener("click", prev);
  $("next").addEventListener("click", next);
  $("play").addEventListener("click", toggle);
  $("stop").addEventListener("click", stop);
  $("speed").addEventListener("change", () => {
    rate = parseFloat($("speed").value);
    audio.defaultPlaybackRate = rate; audio.playbackRate = rate;
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); prev(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); next(); }
  });
  audio.addEventListener("seeked", render);
  (function loop() { if (!audio.paused) render(); requestAnimationFrame(loop); })();
  window.addEventListener("pagehide", () => audio.pause());

  render();
  poll();
</script>
</body>
</html>
