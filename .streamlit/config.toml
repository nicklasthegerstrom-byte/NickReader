[server]
# Gör att mappen src/static serveras (ljudbitarna hämtas därifrån av spelaren)
enableStaticServing = true
# Bara den här datorn når appen. Ändra till "0.0.0.0" om du vill nå den från mobilen.
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[theme]
# NickReader-stilen: orange, grått och svart på varm botten
base = "light"
primaryColor = "#F7941D"
backgroundColor = "#FFF8EC"
secondaryBackgroundColor = "#FFE9C2"
textColor = "#111111"
